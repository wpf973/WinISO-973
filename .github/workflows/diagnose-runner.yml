name: 探测 Runner 硬件

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: 输出硬件信息
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $cs  = Get-CimInstance Win32_ComputerSystem
          $os  = Get-CimInstance Win32_OperatingSystem
          "=== CPU ==="
          "型号         : $($cpu.Name)"
          "制造商       : $($cpu.Manufacturer)"
          "物理核心     : $($cpu.NumberOfCores)"
          "逻辑处理器   : $($cpu.NumberOfLogicalProcessors)"
          "标称主频     : $([math]::Round($cpu.MaxClockSpeed/1000,2)) GHz"
          "当前主频     : $([math]::Round($cpu.CurrentClockSpeed/1000,2)) GHz"
          "L2 缓存      : $([math]::Round($cpu.L2CacheSize/1KB,0)) KB"
          "L3 缓存      : $([math]::Round($cpu.L3CacheSize/1KB,0)) KB"
          "=== 内存 ==="
          "物理内存     : $([math]::Round($cs.TotalPhysicalMemory/1GB,2)) GB"
          "当前可用     : $([math]::Round($os.FreePhysicalMemory/1MB,2)) GB"
          "=== 环境 ==="
          "NUMBER_OF_PROCESSORS : $env:NUMBER_OF_PROCESSORS"
          "ImageOS/ImageVersion : $env:ImageOS / $env:ImageVersion"
          "操作系统     : $($os.Caption) build $($os.BuildNumber)"
          "计算机名     : $env:COMPUTERNAME"
          "=== 磁盘 ==="
          Get-PSDrive -PSProvider FileSystem | ForEach-Object { "  $($_.Name): 可用 $([math]::Round($_.Free/1GB,1)) GB" }
